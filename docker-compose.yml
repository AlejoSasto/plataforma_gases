services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: proyecto_gases
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # 5433 en el host evita conflicto con PostgreSQL local en 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proyecto_gases"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlartifacts
      - mlflow_db:/mlflow

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD}@db:5432/proyecto_gases
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./ml_core:/app/ml_core
      - ./mlruns:/app/mlruns
      - ./storage/reports:/app/storage/reports
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mlflow_data:
  mlflow_db:
