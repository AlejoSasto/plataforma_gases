<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="h3">{{ title }}</h1>
    <p class="text-muted">Sesión iniciada. El dashboard completo llega en el Plan 07.</p>
    <p>
      <a href="/login" class="btn btn-outline-secondary btn-sm">Ir a login</a>
      <button id="logout-btn" type="button" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
    </p>
  </div>
  <script>
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await fetch("/auth/logout", { method: "POST", credentials: "same-origin" });
      window.location.href = "/login";
    });
  </script>
</body>
</html>
